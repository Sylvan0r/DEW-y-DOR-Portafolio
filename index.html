<!DOCTYPE html>
<html lang="es">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Portafolio Profesional</title>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    </head>

    <body class="w-full h-full bg-gradient-to-b from-sky-300 via-blue-300 to-indigo-700">
        <div id="app" class="min-h-screen p-6">
            <!-- Header de la pagina -->
            <header class="relative mb-15 mt-5 flex justify-center items-center">
                <h1 id="portName" class="text-4xl font-extrabold text-blue-600 absolute left-1/2 transform -translate-x-1/2">Mi Portafolio</h1>
                <button id="themeToggle" class="absolute right-0 px-4 py-2 bg-gray-200 rounded-lg text-gray-800 hover:bg-gray-300">☽</button>
            </header>

            <main class="max-w-7xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden grid grid-cols-1 md:grid-cols-3">
                <aside id="sidebar" class="bg-gray-50 p-8 border-r border-gray-200 flex flex-col items-center overflow-hidden">
                    <div class="flex flex-col items-center text-center w-full">
                        <img id="profilePic" class="w-36 h-36 rounded-full object-cover shadow-lg mb-4 border-4 border-white" alt="Foto de perfil">
                        <h2 id="aboutMe" class="text-2xl font-bold text-gray-900 mb-2">Sobre Mí</h2>
                        <p id="bio" class="text-gray-600 px-2"></p>
                    </div>

                    <div class="w-full border-t border-gray-300 my-6"></div>

                    <div class="w-full space-y-3 px-2 text-gray-700">
                        <p id="email" class="font-medium break-words"></p>
                        <p id="telf" class="font-medium break-words"></p>
                        <p id="genero" class="font-medium break-words"></p>
                        <p id="nacionalidad" class="font-medium break-words"></p>
                        <p id="fechaNacimiento" class="font-medium break-words"></p>
                    </div>

                    <div class="w-full border-t border-gray-300 my-6"></div>

                    <div class="w-full text-center">
                        <h3 id="frameWorks" class="text-xl font-semibold text-gray-900 mb-4">Frameworks con los que trabajo</h3>
                        <div id="skills" class="flex flex-wrap justify-center gap-4"></div>
                    </div>
                </aside>

                <section id="mainContent" class="md:col-span-2 p-10 text-gray-700">
                    <div id="experience" class="mb-10">
                        <h2 id="expTxt" class="text-3xl font-semibold mb-4 text-blue-600">Experiencia Laboral</h2>
                        <div id="experienceList" class="space-y-3 list-disc list-inside"></div>
                    </div>

                    <div id="projects">
                        <h2 id="projTxt" class="text-3xl font-semibold mb-4 text-blue-600">Proyectos</h2>
                        <div id="projectsList" class="space-y-3 list-disc list-inside"></div>
                    </div>
                </section>
            </main>
        </div>

        <script src="JS/script.js"></script>
    </body>
</html>
