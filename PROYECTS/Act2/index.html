<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Juego de Parejas</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>
    <header>
        <h1>Juego de Parejas</h1>
    </header>

    <main>
        <div id="game-board" class="board"></div>
        <p id="score"></p>
    </main>

    <!-- Pantalla de victoria -->
    <div id="win-screen" class="win-hidden">
        <div class="win-box">
            <h2>¡Has ganado!</h2>
            <p>¡Encontraste todas las parejas!</p>
            <button id="restart-btn">Jugar de nuevo</button>
        </div>
    </div>

    <script src="JS/script.js"></script>
</body>
</html>
