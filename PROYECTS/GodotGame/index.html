<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="CSS/style.css">
        <title>Godot Game</title>
    </head>

    <body>
        <div class="game-container">
            <iframe src="GAME/test.html"></iframe>

            <div class="controls">
                <div class="control-group">
                    <div class="key">A</div>
                    <div class="key">D</div>
                    <span class="label">o</span>
                    <div class="key">←</div>
                    <div class="key">→</div>
                    <span class="label">Mover</span>
                </div>

                <div class="control-group">
                    <div class="key">␣</div>
                    <span class="label">Saltar</span>
                </div>
            </div>
        </div>
    </body>
</html>
