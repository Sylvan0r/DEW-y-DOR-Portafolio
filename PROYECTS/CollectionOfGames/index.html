<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Retro Game Loader</title>
        <link rel="stylesheet" href="CSS/style.css">
    </head>
    <body>

        <!-- Monitor 3D -->
        <div id="monitor-wrapper">
            <model-viewer
                id="monitor-3d"
                src="old_computer/scene.gltf"
                shadow-intensity="0"
                disable-pan
                camera-orbit="-90deg 90deg"
            ></model-viewer>

            <div id="screen-overlay">
                <iframe id="visor" name="visor"></iframe>
                <div class="scanlines"></div>
            </div>
        </div>

        <script src="JS/script.js"></script>
        <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
    </body>
</html>
